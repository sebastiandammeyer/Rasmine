<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rasmines ønskeliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBEFE6;
    --bg2: #F6DCCB;
    --card: #FFFCF8;
    --ink: #2B211C;
    --muted: #7D6F63;
    --line: #EFE2D6;
    --red: #C8102E;
    --red-dark: #9E0B23;
    --head: #7A1020;
    --gold: #E8B44F;
    --sky1: #FFE3D3;
    --sky2: #FFC9C0;
    --thumb: #F7EEE6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2A1418;
      --bg2: #1C0D10;
      --card: #1F1A17;
      --ink: #F4ECE2;
      --muted: #A99B8E;
      --line: #352D28;
      --red: #E2475C;
      --red-dark: #F07A88;
      --head: #FFD9D0;
      --sky1: #3A1A20;
      --sky2: #5A2430;
      --thumb: #2A2420;
    }
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(rgba(200,16,46,.08) 2px, transparent 2.1px),
      radial-gradient(rgba(232,180,79,.12) 1.5px, transparent 1.6px),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-size: 46px 46px, 23px 23px, 100% 100%;
    background-position: 0 0, 11px 13px, 0 0;
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  /* ---------- Toppen med flagranke, balloner og Rasmine ---------- */
  .top {
    position: relative;
    overflow: hidden;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 100%);
    color: var(--head);
    text-align: center;
    padding: 70px 16px 0;
  }
  .ranke { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 70px; }
  .ranke .flag { transform-box: fill-box; transform-origin: top center; animation: vift 3s ease-in-out infinite; }
  @keyframes vift { 50% { transform: rotate(4deg); } }

  .ballon {
    position: absolute; bottom: -40px; width: 70px; height: auto;
    animation: op 9s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes op {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-26px) rotate(3deg); }
  }
  .top h1 {
    position: relative;
    font-family: Pacifico, Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 9vw, 70px);
    line-height: 1.15;
    margin: 30px 0 6px;
    text-shadow: 0 2px 0 #fff;
  }
  @media (prefers-color-scheme: dark) { .top h1 { text-shadow: 0 2px 12px rgba(0,0,0,.4); } }
  .top p { position: relative; margin: 0 auto; max-width: 520px; opacity: .85; }
  .portraet {
    position: relative; display: block;
    width: min(300px, 72vw); height: auto;
    margin: 26px auto -34px;
    filter: brightness(1.08) saturate(1.05) drop-shadow(0 10px 18px rgba(80, 20, 20, .25));
  }
  .kant {
    position: relative; display: block;
    width: calc(100% + 32px); height: 40px;
    margin: 0 -16px -1px;
  }

  .konfetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .konfetti i {
    position: absolute; top: -12px; width: 7px; height: 12px; border-radius: 2px;
    opacity: .8;
    animation: fald linear infinite;
  }
  @keyframes fald { to { transform: translate(40px, 105vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .ballon, .konfetti, .ranke .flag { animation: none; }
    .konfetti { display: none; }
  }

  /* ---------- Liste ---------- */
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 64px; position: relative; z-index: 6; }
  section { margin-top: 40px; }
  h2 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 14px;
    display: flex; align-items: center; gap: 10px;
    color: var(--head);
  }
  h2::before { content: "🎈"; font-size: 20px; }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--red);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(120, 30, 30, .12);
  }
  th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 14px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .billede { width: 112px; }
  .billede img, .billede .tom {
    display: block; width: 88px; height: 88px;
    object-fit: contain; border-radius: 10px;
    background: #fff; padding: 6px;
  }
  .billede .tom {
    display: grid; place-items: center;
    background: var(--thumb); font-size: 36px;
  }
  .navn { font-weight: 600; }
  .model {
    display: inline-block; margin-top: 4px;
    font-size: 13px; font-weight: 600;
    color: var(--red-dark);
    background: color-mix(in srgb, var(--red) 12%, transparent);
    padding: 2px 8px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  .note { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .link { width: 170px; }
  .link a {
    display: block; text-align: center;
    background: var(--red); color: #fff;
    font-weight: 600; font-size: 14px;
    text-decoration: none;
    padding: 9px 12px; border-radius: 999px;
    margin: 4px 0;
  }
  .link a:hover { background: var(--red-dark); }
  .link a.sekundaer {
    background: transparent; color: var(--red);
    border: 1.5px solid var(--red);
  }
  .link .ingen { color: var(--muted); font-size: 14px; text-align: center; display: block; }

  @media (max-width: 600px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; }
    tr {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 4px 14px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    tr:last-child { border-bottom: 0; }
    td { padding: 0; border: 0; }
    .billede { width: auto; grid-row: span 2; }
    .link { width: auto; }
    .link a { display: inline-block; margin: 6px 6px 0 0; }
    .link .ingen { text-align: left; }
    .ballon { width: 48px; }
  }

  .hilsen {
    text-align: center; margin: 64px 0 0;
    font-family: Pacifico, Georgia, serif;
    font-size: 34px; color: var(--head);
  }
  .fest { display: block; width: 100%; height: auto; margin-top: -10px; }
  .flamme { transform-box: fill-box; transform-origin: bottom center; animation: flakker .9s ease-in-out infinite alternate; }
  @keyframes flakker { to { transform: scale(.85, 1.12); } }
  @media (prefers-reduced-motion: reduce) { .flamme { animation: none; } }
</style>
</head>
<body>

<div class="konfetti" aria-hidden="true"></div>

<header class="top">
  <!-- Flagranke med Dannebrog -->
  <svg class="ranke" viewBox="0 0 1200 70" aria-hidden="true">
    <defs>
      <g id="dk">
        <path d="M-16 0 h32 l-16 34 Z" fill="#C8102E"/>
        <path d="M-5 0 h5 v34 h-5 Z M-16 11 h32 v5 h-32 Z" fill="#fff" clip-path="url(#vimpel)"/>
      </g>
      <clipPath id="vimpel" clipPathUnits="userSpaceOnUse"><path d="M-16 0 h32 l-16 34 Z"/></clipPath>
    </defs>
    <path class="snor" d="M0 8 Q 600 46 1200 8" stroke="#8A6A55" stroke-width="2" fill="none"/>
  </svg>

  <svg class="ballon" style="left:4%;animation-delay:-2s" viewBox="0 0 60 140" aria-hidden="true">
    <path d="M30 70 q-6 20 4 40 q-8 14 0 30" stroke="#8A6A55" stroke-width="1.2" fill="none"/>
    <ellipse cx="30" cy="34" rx="26" ry="32" fill="#C8102E"/><path d="M26 65 h8 l-4 6 Z" fill="#C8102E"/>
    <ellipse cx="20" cy="22" rx="6" ry="10" fill="#fff" opacity=".35"/>
  </svg>
  <svg class="ballon" style="left:14%;width:56px;animation-delay:-5s;bottom:10px" viewBox="0 0 60 140" aria-hidden="true">
    <path d="M30 70 q-6 20 4 40 q-8 14 0 30" stroke="#8A6A55" stroke-width="1.2" fill="none"/>
    <ellipse cx="30" cy="34" rx="26" ry="32" fill="#FFFFFF"/><path d="M26 65 h8 l-4 6 Z" fill="#FFFFFF"/>
    <ellipse cx="20" cy="22" rx="6" ry="10" fill="#F6DCCB" opacity=".7"/>
  </svg>
  <svg class="ballon" style="right:5%;animation-delay:-1s" viewBox="0 0 60 140" aria-hidden="true">
    <path d="M30 70 q6 20 -4 40 q8 14 0 30" stroke="#8A6A55" stroke-width="1.2" fill="none"/>
    <ellipse cx="30" cy="34" rx="26" ry="32" fill="#E8B44F"/><path d="M26 65 h8 l-4 6 Z" fill="#E8B44F"/>
    <ellipse cx="20" cy="22" rx="6" ry="10" fill="#fff" opacity=".35"/>
  </svg>
  <svg class="ballon" style="right:15%;width:58px;animation-delay:-6s;bottom:16px" viewBox="0 0 60 140" aria-hidden="true">
    <path d="M30 70 q6 20 -4 40 q8 14 0 30" stroke="#8A6A55" stroke-width="1.2" fill="none"/>
    <ellipse cx="30" cy="34" rx="26" ry="32" fill="#C8102E"/><path d="M26 65 h8 l-4 6 Z" fill="#C8102E"/>
    <ellipse cx="20" cy="22" rx="6" ry="10" fill="#fff" opacity=".35"/>
  </svg>

  <h1>Rasmines ønskeliste</h1>
  <p>Fødselsdag 🎂 · Linkene viser hvad det er. Find det gerne billigere et andet sted.</p>

  <img class="portraet" src="rasmine.png" alt="Rasmine som lille, pakket ind i et håndklæde med armene over hovedet">

  <svg class="kant" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 40 V20 Q 30 0 60 20 T 120 20 T 180 20 T 240 20 T 300 20 T 360 20 T 420 20 T 480 20 T 540 20 T 600 20 T 660 20 T 720 20 T 780 20 T 840 20 T 900 20 T 960 20 T 1020 20 T 1080 20 T 1140 20 T 1200 20 V40 Z" fill="var(--bg)"/>
  </svg>
</header>

<main>

  <!-- Ønskerne: kopiér en <tr> ... </tr> for hvert ønske -->
  <section>
    <h2>Ønsker</h2>
    <table>
      <thead><tr><th>Billede</th><th>Ønske</th><th>Link</th></tr></thead>
      <tbody>
        <tr>
          <td class="billede"><div class="tom">🎁</div></td>
          <td>
            <div class="navn">Ønske 1</div>
            <div class="note">Skriv en note her</div>
          </td>
          <td class="link"><a href="#" target="_blank" rel="noopener">Se varen ↗</a></td>
        </tr>
        <tr>
          <td class="billede"><div class="tom">💐</div></td>
          <td>
            <div class="navn">Ønske 2</div>
            <span class="model">Model / størrelse</span>
          </td>
          <td class="link"><span class="ingen">Intet link</span></td>
        </tr>
        <tr>
          <td class="billede"><div class="tom">📚</div></td>
          <td>
            <div class="navn">Ønske 3</div>
          </td>
          <td class="link"><span class="ingen">Intet link</span></td>
        </tr>
      </tbody>
    </table>
  </section>

  <p class="hilsen">Tillykke med fødselsdagen!</p>
</main>

<!-- Fødselsdagsbord med kage, gaver og flag -->
<svg class="fest" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
    <g id="flagstang">
      <rect x="0" y="0" width="3" height="90" fill="#8A6A55"/>
      <circle cx="1.5" cy="-2" r="4" fill="#E8B44F"/>
      <rect x="3" y="4" width="46" height="32" fill="#C8102E"/>
      <rect x="3" y="17" width="46" height="6" fill="#fff"/>
      <rect x="17" y="4" width="6" height="32" fill="#fff"/>
    </g>
    <g id="gave">
      <rect x="0" y="0" width="60" height="46" rx="3"/>
      <rect x="26" y="0" width="8" height="46" fill="#E8B44F"/>
      <rect x="0" y="16" width="60" height="7" fill="#E8B44F"/>
      <path d="M30 0 q-18 -16 -22 -4 q4 6 22 4 q18 2 22 -4 q-4 -12 -22 4 Z" fill="#E8B44F"/>
    </g>
  </defs>
  <!-- bord -->
  <path d="M0 200 H1200 V260 H0 Z" fill="#E7C9B4"/>
  <path d="M0 200 H1200" stroke="#D2AE95" stroke-width="4"/>
  <!-- flag -->
  <use href="#flagstang" x="150" y="110"/>
  <use href="#flagstang" x="1010" y="110"/>
  <use href="#flagstang" x="420" y="120"/>
  <!-- gaver -->
  <use href="#gave" x="220" y="154" fill="#C8102E"/>
  <use href="#gave" x="290" y="166" fill="#FFFFFF" transform="translate(290 166) scale(.75) translate(-290 -166)"/>
  <use href="#gave" x="860" y="154" fill="#2E7D4F"/>
  <use href="#gave" x="930" y="164" fill="#C8102E" transform="translate(930 164) scale(.8) translate(-930 -164)"/>
  <!-- kage -->
  <g transform="translate(520 100)">
    <rect x="0" y="50" width="160" height="50" rx="6" fill="#F6E1C8"/>
    <rect x="20" y="10" width="120" height="44" rx="6" fill="#FFFFFF"/>
    <path d="M20 22 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 V10 H20 Z" fill="#C8102E"/>
    <path d="M0 62 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 V50 H0 Z" fill="#FFFFFF"/>
    <circle cx="40" cy="80" r="4" fill="#E8B44F"/><circle cx="80" cy="84" r="4" fill="#C8102E"/><circle cx="120" cy="80" r="4" fill="#E8B44F"/>
    <!-- lys -->
    <g>
      <rect x="44" y="-14" width="6" height="24" fill="#C8102E"/>
      <rect x="77" y="-18" width="6" height="28" fill="#FFFFFF" stroke="#C8102E" stroke-width="1"/>
      <rect x="110" y="-14" width="6" height="24" fill="#C8102E"/>
      <path class="flamme" d="M47 -28 q-6 8 0 12 q6 -4 0 -12 Z" fill="#FFB000"/>
      <path class="flamme" d="M80 -32 q-6 8 0 12 q6 -4 0 -12 Z" fill="#FFB000"/>
      <path class="flamme" d="M113 -28 q-6 8 0 12 q6 -4 0 -12 Z" fill="#FFB000"/>
    </g>
    <!-- lille flag i kagen -->
    <rect x="140" y="-30" width="2" height="44" fill="#8A6A55"/>
    <rect x="142" y="-30" width="22" height="15" fill="#C8102E"/>
    <rect x="142" y="-24" width="22" height="3" fill="#fff"/>
    <rect x="148" y="-30" width="3" height="15" fill="#fff"/>
  </g>
</svg>

<script>
  // Dannebrog-vimpler på ranken (følger buen, tegnes i skærmens bredde så de ikke strækkes)
  const r = document.querySelector('.ranke');
  const ns = 'http://www.w3.org/2000/svg';
  function tegnRanke() {
    const W = r.clientWidth || 1200;
    r.setAttribute('viewBox', `0 0 ${W} 70`);
    r.querySelector('.snor').setAttribute('d', `M0 8 Q ${W / 2} 46 ${W} 8`);
    r.querySelectorAll('g.v').forEach(g => g.remove());
    const n = Math.max(8, Math.round(W / 52));
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      const x = t * W;
      const y = 8 + 76 * t * (1 - t);
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'v');
      g.setAttribute('transform', `translate(${x} ${y})`);
      const u = document.createElementNS(ns, 'use');
      u.setAttribute('href', '#dk');
      u.setAttribute('class', 'flag');
      u.style.animationDelay = (-Math.random() * 3) + 's';
      g.appendChild(u);
      r.appendChild(g);
    }
  }
  tegnRanke();
  addEventListener('resize', tegnRanke);
  // Konfetti i rød, hvid og guld
  const k = document.querySelector('.konfetti');
  const farver = ['#C8102E', '#FFFFFF', '#E8B44F', '#C8102E'];
  for (let i = 0; i < 30; i++) {
    const f = document.createElement('i');
    f.style.background = farver[i % farver.length];
    f.style.left = Math.random() * 100 + '%';
    f.style.animationDuration = (12 + Math.random() * 14) + 's';
    f.style.animationDelay = (-Math.random() * 26) + 's';
    if (i % 4 === 1) f.style.boxShadow = '0 0 0 1px rgba(0,0,0,.06)';
    k.appendChild(f);
  }
</script>
</body>
</html>
